<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ニコ実 過去ログ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f97316'/%3E%3Cpath d='M24 12l8 8 8-8' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='9' y='20' width='46' height='32' rx='6' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='46' cy='46' r='12' fill='%23fff'/%3E%3Cpath d='M46 39v7l5 3' stroke='%23f97316' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"><style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2129;
    --line: #d9dce1;
    --accent: #2563eb;
    --chip: #eef1f5;
    --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --panel: #1b1e24;
      --text: #e8eaed;
      --line: #343842;
      --accent: #3b82f6;
      --chip: #262a32;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    flex: none;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 6px 8px;
    padding-top: max(6px, env(safe-area-inset-top));
    overflow-x: hidden;
  }
  form { display: flex; flex-wrap: wrap; gap: 6px; }
  .row { display: flex; gap: 6px; min-width: 0; }
  select, input, button {
    font: inherit;
    color: var(--text);
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 6px;
    min-width: 0;
    margin: 0;
  }
  select, input { background: var(--bg); padding: 0 6px; }
  .bad { border-color: var(--err); }
  .go {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
    padding: 0 20px;
    cursor: pointer;
  }
  .go:active { opacity: .85; }
  main { flex: 1; min-height: 0; overflow: auto; }
  .live {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 440px;
    margin: 0 auto;
    padding: 16px 12px;
  }
  .live h2 {
    grid-column: 1 / -1;
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }
  .live a {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .live a:active { background: var(--chip); }
  @media (hover: hover) { .live a:hover { border-color: var(--accent); color: var(--accent); } }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }

  @media (max-width: 600px) {
    form { display: grid; gap: 6px; }
    .row { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.3fr) minmax(0, 1fr); }
    .row.dur { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
    .row > * { width: 100%; max-width: 100%; min-width: 0 !important; }
    input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; text-align: left; padding: 0 4px; }
    .go { padding: 0; }
  }
</style>
</head>
<body>
<header>
  <form id="f" autocomplete="off">
    <div class="row">
      <select id="ch" aria-label="チャンネル">
        <option value="jk1">NHK総合</option>
        <option value="jk2">NHK Eテレ</option>
        <option value="jk4">日本テレビ</option>
        <option value="jk6">TBSテレビ</option>
        <option value="jk8">フジテレビ</option>
        <option value="jk5">テレビ朝日</option>
        <option value="jk7">テレビ東京</option>
        <option value="jk9">TOKYO MX</option>
        <option value="jk10">テレ玉</option>
      </select>
      <input type="date" id="date" aria-label="日付">
      <input type="time" id="time" step="60" aria-label="開始時刻">
    </div>
    <div class="row dur">
      <select id="dur" aria-label="長さ">
        <option value="0.5">0.5h</option>
        <option value="1">1h</option>
        <option value="1.5">1.5h</option>
        <option value="2">2h</option>
        <option value="2.5">2.5h</option>
        <option value="3">3h</option>
      </select>
      <button type="submit" class="go">見る</button>
    </div>
  </form>
</header>
<main>
  <nav class="live" id="live">
    <h2>リアルタイム（公式）</h2>
    <a href="https://live.nicovideo.jp/watch/ch2646436" target="_blank" rel="noopener">NHK総合</a>
    <a href="https://live.nicovideo.jp/watch/ch2646437" target="_blank" rel="noopener">Eテレ</a>
    <a href="https://live.nicovideo.jp/watch/ch2646438" target="_blank" rel="noopener">日テレ</a>
    <a href="https://live.nicovideo.jp/watch/ch2646440" target="_blank" rel="noopener">TBS</a>
    <a href="https://live.nicovideo.jp/watch/ch2646442" target="_blank" rel="noopener">フジ</a>
    <a href="https://live.nicovideo.jp/watch/ch2646439" target="_blank" rel="noopener">テレ朝</a>
    <a href="https://live.nicovideo.jp/watch/ch2646441" target="_blank" rel="noopener">テレ東</a>
    <a href="https://live.nicovideo.jp/watch/ch2646485" target="_blank" rel="noopener">MX</a>
  </nav>
  <iframe id="viewer" hidden allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
</main>
<script>
(function () {
  var BASE = 'https://nx-jikkyo.tsukumijima.net/log/';
  var KEY = 'nicojikkyo.last';
  var EXTRA_MIN = 10; // 選んだ長さに足す分数
  var $ = function (id) { return document.getElementById(id); };
  var ch = $('ch'), date = $('date'), time = $('time'), dur = $('dur'), viewer = $('viewer');

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function stamp(d) {
    return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      pad(d.getHours()) + pad(d.getMinutes()) + '00';
  }
  function setHours(h) { dur.value = String(h); }

  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (s && s.ch) {
      ch.value = s.ch;
      date.value = s.date || '';
      time.value = s.time || '';
      setHours([0.5, 1, 1.5, 2, 2.5, 3].indexOf(s.h) >= 0 ? s.h : 1);
    } else {
      var now = new Date();
      date.value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
      time.value = pad(now.getHours()) + ':00';
      setHours(1);
    }
    if (!ch.value) ch.selectedIndex = 0;
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ ch: ch.value, date: date.value, time: time.value, h: +dur.value }));
    } catch (e) {}
  }

  [date, time].forEach(function (el) {
    el.addEventListener('input', function () { el.classList.remove('bad'); });
  });

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    date.classList.toggle('bad', !date.value);
    time.classList.toggle('bad', !time.value);
    if (!date.value || !time.value) return;
    var p = date.value.split('-'), t = time.value.split(':');
    var start = new Date(+p[0], +p[1] - 1, +p[2], +t[0], +t[1], 0);
    var end = new Date(start.getTime() + (+dur.value * 60 + EXTRA_MIN) * 60000);
    viewer.src = BASE + ch.value + '/' + stamp(start) + '-' + stamp(end);
    viewer.hidden = false;
    $('live').hidden = true;
    document.querySelector('main').style.overflow = 'hidden';
    save();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  load();
})();
</script>
</body>
</html>
